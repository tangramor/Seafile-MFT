version: "3.9"

services:
  seafile-mft:
    build: .
    container_name: seafile-mft
    image: seafile-mft:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /etc/localtime:/etc/localtime
      - ./seafile_mft.db:/app/seafile_mft.db
      # 不再挂载 .env 文件，改用 environment 传递关键配置
    environment:
      - TZ=Asia/Shanghai
      # 从 .env 文件读取并传递（需要在启动前设置这些环境变量）
      - INTRANET_SEAFILE_URL=${INTRANET_SEAFILE_URL:-http://192.168.101.111}
      - INTRANET_SEAFILE_TOKEN=${INTRANET_SEAFILE_TOKEN:-}
      - INTRANET_REPO_ID=${INTRANET_REPO_ID:-eb8d70e1-736c-4548-b1bc-01d129071a11}
      - EXTRANET_SEAFILE_URL=${EXTRANET_SEAFILE_URL:-https://seafile.example.com}
      - EXTRANET_SEAFILE_TOKEN=${EXTRANET_SEAFILE_TOKEN:-}
      - EXTRANET_REPO_ID=${EXTRANET_REPO_ID:-}
      # ── 内网 SMTP（审批链接指向内网地址）
      - INTRANET_SMTP_HOST=${INTRANET_SMTP_HOST:-}
      - INTRANET_SMTP_PORT=${INTRANET_SMTP_PORT:-465}
      - INTRANET_SMTP_USER=${INTRANET_SMTP_USER:-}
      - INTRANET_SMTP_PASSWORD=${INTRANET_SMTP_PASSWORD:-}
      - INTRANET_SMTP_USE_SSL=${INTRANET_SMTP_USE_SSL:-true}
      # ── 外网 SMTP（审批链接指向外网地址；留空则只发内网邮件）
      - EXTRANET_SMTP_HOST=${EXTRANET_SMTP_HOST:-}
      - EXTRANET_SMTP_PORT=${EXTRANET_SMTP_PORT:-465}
      - EXTRANET_SMTP_USER=${EXTRANET_SMTP_USER:-}
      - EXTRANET_SMTP_PASSWORD=${EXTRANET_SMTP_PASSWORD:-}
      - EXTRANET_SMTP_USE_SSL=${EXTRANET_SMTP_USE_SSL:-true}
      # ── 旧版单 SMTP 兼容（若未设置 INTRANET_SMTP_* 则回退）
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - REVIEWER_EMAILS=${REVIEWER_EMAILS:-}
      # ── 应用访问地址（用于邮件中的审批链接）
      - INTRANET_APP_URL=${INTRANET_APP_URL:-http://192.168.101.111:8081}
      - EXTRANET_APP_URL=${EXTRANET_APP_URL:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8081}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./seafile_mft.db}
      - REVIEW_TOKEN_EXPIRE_HOURS=${REVIEW_TOKEN_EXPIRE_HOURS:-72}
      # ── LDAP 认证
      - LDAP_HOST=${LDAP_HOST:-}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_USE_SSL=${LDAP_USE_SSL:-false}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-dc=example,dc=com}
      - LDAP_USER_DN_TEMPLATE=${LDAP_USER_DN_TEMPLATE:-}
      - LDAP_REVIEWER_GROUP=${LDAP_REVIEWER_GROUP:-mft-reviewers}
      - LDAP_ADMIN_GROUP=${LDAP_ADMIN_GROUP:-mft-admins}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      # ── 认证方式（local / ldap / seafile）
      - AUTH_METHOD=${AUTH_METHOD:-ldap}
      # ── Seafile 认证目标（intranet / extranet，仅 AUTH_METHOD=seafile 时生效）
      - AUTH_SEAFILE=${AUTH_SEAFILE:-intranet}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
      - POLL_ON_STARTUP=${POLL_ON_STARTUP:-true}
      # ── 文件检测模式（auto/webhook/poll）
      # auto    = 启动时自动检测 Seafile 版本（>=7.0 用 Webhook，否则轮询）
      # webhook = 强制 Webhook（需 Seafile >= 7.0 并在后台配置 Webhook URL）
      # poll    = 强制轮询（兼容所有版本，默认推荐）
      - DETECTION_MODE=${DETECTION_MODE:-auto}
      # Webhook 签名密钥（Seafile 后台配置 Webhook 时填写相同值，留空则跳过验证）
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # ── 出口 DLP 扫描（scan-worker 集成，已并入本栈，默认关闭）──
      # 开启后文件审批通过、传出外网前送 scan-worker 扫描（同栈 scan-gateway / scan-worker）；
      # 命中则经下方 DLP_CALLBACK_URL 回传 MFT 挂起等审核。
      - DLP_ENABLED=${DLP_ENABLED:-false}
      - DLP_GATEWAY_URL=${DLP_GATEWAY_URL:-http://scan-gateway:8080}
      # 容器内回调地址：scan-worker 通过此地址回传扫描结果（8080 为 MFT 容器内端口，8081 仅为主机映射端口）
      - DLP_CALLBACK_URL=${DLP_CALLBACK_URL:-http://seafile-mft:8080/internal/dlp-webhook}
      - DLP_ALERT_SEVERITIES=${DLP_ALERT_SEVERITIES:-critical,high}
      - DLP_MAX_FILE_SIZE=${DLP_MAX_FILE_SIZE:-104857600}
      - DLP_SUBMIT_TIMEOUT=${DLP_SUBMIT_TIMEOUT:-30}
      - DLP_FAIL_CLOSED=${DLP_FAIL_CLOSED:-false}
    healthcheck:
      # 注意：基础镜像 python:3.11-slim 不含 curl，原 curl 健康检查会因
      # "executable file not found" 永远 unhealthy。改用镜像自带的 python 发起探测。
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ══════════════════════════════════════════════════════════
  #  出口 DLP 扫描栈（scan-worker，已并入根栈，与 seafile-mft 同处 sefile-mft-net 网络）
  #  文件审批通过、传出外网前送此处扫描；命中则回传 MFT 挂起等审核
  #  组件：MinIO(暂存) + Kafka(队列) + Gateway(接收) + Worker(解包+YARA+Malcontent)
  # ══════════════════════════════════════════════════════════

  scan-minio:
    image: minio/minio:latest
    container_name: scan-minio
    restart: unless-stopped
    networks:
      - default
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scanadmin
      MINIO_ROOT_PASSWORD: Scan@StrongPass2026
    volumes:
      - scan-minio-data:/data
      - /etc/localtime:/etc/localtime
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  scan-kafka:
    image: bitnami/kafka:3.7
    container_name: scan-kafka
    restart: unless-stopped
    networks:
      - default
    volumes:
      - /etc/localtime:/etc/localtime
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@scan-kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://scan-kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_PORT: 9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  scan-gateway:
    build: ./scan-worker/gateway
    container_name: scan-gateway
    image: scan-gateway
    restart: unless-stopped
    networks:
      - default
    volumes:
      - /etc/localtime:/etc/localtime
    environment:
      MINIO_ENDPOINT: http://scan-minio:9000
      MINIO_ACCESS_KEY: scanadmin
      MINIO_SECRET_KEY: Scan@StrongPass2026
      MINIO_BUCKET: outbound-files
      KAFKA_BROKER: scan-kafka:9092
      KAFKA_TOPIC: file-scan-queue
    depends_on:
      scan-minio:
        condition: service_healthy
      scan-kafka:
        condition: service_healthy

  scan-worker:
    build: ./scan-worker/scanner
    container_name: scan-worker
    image: scan-worker
    restart: unless-stopped
    networks:
      - default
    environment:
      KAFKA_BROKER: scan-kafka:9092
      KAFKA_TOPIC: file-scan-queue
      KAFKA_GROUP: scanner-group
      MINIO_ENDPOINT: http://scan-minio:9000
      MINIO_ACCESS_KEY: scanadmin
      MINIO_SECRET_KEY: Scan@StrongPass2026
      MINIO_BUCKET: outbound-files
      YARA_RULES_DIR: /rules
      MAX_UNPACK_DEPTH: "5"
      # 扫描结果回传至 MFT 的 DLP 回调（clean/alert 均发送）
      # 注意：容器间通信用 MFT 容器内端口 8080（8081 仅为主机映射端口）
      RESULT_WEBHOOK: http://seafile-mft:8080/internal/dlp-webhook
      ALERT_WEBHOOK: http://seafile-mft:8080/internal/dlp-webhook
      LOG_LEVEL: INFO
    volumes:
      - /etc/localtime:/etc/localtime
      - ./scan-worker/rules:/rules:ro       # YARA 规则热加载
      - scan-worker-cache:/cache
    depends_on:
      scan-kafka:
        condition: service_healthy
      scan-minio:
        condition: service_healthy

networks:
  default:
    name: seafile-mft-net

volumes:
  scan-minio-data:
  scan-worker-cache:
